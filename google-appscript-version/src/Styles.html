<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
:root { --sidebar-width: 264px; --bg: #f5f7fb; --border: #dce3ee; --text: #1f2937; --muted: #6b7280; --primary: #0f766e; --accent: #2563eb; }
* { box-sizing: border-box; }

.sidebar-nav button:hover, .sidebar-nav button.active { background: rgba(255,255,255,.09); color: #fff; }

.content-area { padding: 24px; }
.page-title { font-size: 1.45rem; margin: 0; font-weight: 700; }

</style>
