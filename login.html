<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Masuk - Stok Souvenir WKS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css?v=plain-excel-success-v3-20260812" rel="stylesheet">
</head>
<body class="login-page">
  <main class="simple-login-shell">
    <form class="simple-login-card" id="loginForm">
      <div class="simple-login-header">
        <div class="brand-mark simple-login-logo brand-image-mark"><img src="assets/mbos.png?v=plain-excel-success-v3-20260812" alt="Logo MBOS"></div>
        <h1>Manajemen Stok</h1>
        <p>Masuk untuk mengelola data stok souvenir.</p>
      </div>

      <div id="loginAlert" class="mb-3"></div>

      <div class="mb-3">
        <label class="form-label" for="pernerInput">Perner</label><input class="form-control form-control-lg" id="pernerInput" type="text" name="perner" inputmode="numeric" autocomplete="username" placeholder="Contoh: 100001" required>
      </div>

      <div class="mb-2">
        <label class="form-label" for="passwordInput">Kata Sandi</label>
        <input class="form-control form-control-lg" id="passwordInput" type="password" name="password" autocomplete="current-password" placeholder="Masukkan kata sandi" required>
      </div>

      <div class="login-help-row mb-4">
        <button class="btn btn-link p-0" type="button" data-bs-toggle="modal" data-bs-target="#forgotPasswordModal">Lupa password?</button>
      </div>

      <button class="btn btn-primary btn-lg w-100 btn-icon justify-content-center" type="submit">
        <i class="bi bi-box-arrow-in-right"></i> Masuk
      </button>
    </form>
  </main>

  <div class="modal fade" id="forgotPasswordModal" tabindex="-1" aria-labelledby="forgotPasswordTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="forgotPasswordForm">
        <div class="modal-header">
          <h2 class="modal-title h5" id="forgotPasswordTitle">Lupa Password</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
        </div>
        <div class="modal-body">
          <div id="forgotPasswordAlert" class="mb-3"></div>
          <p class="text-muted small">Masukkan Perner akun terdaftar untuk menerima tautan reset password.</p>
          <label class="form-label" for="resetPernerInput">Perner Terdaftar</label>
          <input class="form-control" id="resetPernerInput" type="text" name="perner" inputmode="numeric" autocomplete="username" placeholder="Contoh: 100001" required>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Batal</button>
          <button type="submit" class="btn btn-primary btn-icon"><i class="bi bi-send"></i>Kirim Link Reset</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="pages/login.js?v=plain-excel-success-v3-20260812"></script>
</body>
</html>
